<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header class="cabecalho" id="cabecalho"></header>
    <main>
        <div class="formularioLogin">
        <section id="login">
        <h2 class="tituloPagina">Acesse sua Conta</h2>
        <p class="descricao">Infome seus dados para continuar</p>

        <form method="post">
        <label for="email-login"></label>
        <input type="email" id="email-login" name="email" autocomplete="username" placeholder="Email*" required oninvalid="this.setCustomValidity('Insira um e-mail válido.')" oninput="this.setCustomValidity('')">
        
        <label for="senha-login"></label>
        <input type="password" id="senha-login" name="senha" minlength="8" autocomplete="current-password" placeholder="Senha*" required oninvalid="this.setCustomValidity('A senha deve ter no mínimo 8 caracteres')" oninput="this.setCustomValidity('')">

        <button type="submit" class="botaopadrao">Entrar</button>
        </form>

        <p id="recuperarSenha" class="recuperarSenha" onclick="recuperarSenha()" onmouseover="sublinhadoRecuperarSenhaEscuro()" onmouseout="sublinhadoRecuperarSenhaClaro()">Esqueci minha senha</p>
        </section>
        
        <section id="recuperacao">
            <h2 class="tituloPagina">Recuperar Senha</h2>
            <p class="descricao">Informe seu e-mail para recuperar sua senha.</p>

            <form method="post" onsubmit="event.preventDefault(); emailRecuperacao()">
            <label for="email-recuperacao"></label>
            <input type="email" id="email-recuperacao" name="email" autocomplete="email" placeholder="Email*" required oninvalid="this.setCustomValidity('Insira um e-mail válido.')" oninput="this.setCustomValidity('')">

            <button type="submit" class="botaopadrao">Enviar</button>
            </form>

            <p id="status-recuperacao" role="status"></p>
            
            <p type="button" onclick="voltarLogin()" class="voltarLogin">Voltar ao Login</p>
        </section>
        </div>
    </main>
    <footer id="rodape"></footer>
</body>
</html>
